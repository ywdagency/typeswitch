name: Swift verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Run automated tests
        run: swift test
      - name: Test packaging and dictionary tooling
        run: python3 -m unittest discover -s scripts/tests
      - name: Check packaging scripts
        run: bash -n scripts/build-app.sh scripts/build-dev-app.sh scripts/build-release.sh scripts/lib/notarization.sh
      - name: Build release executables
        run: swift build --configuration release
      - name: Build and verify preview DMG
        run: |
          ./scripts/build-release.sh 0.1.0 1 --preview
          python3 scripts/verify-dmg.py dist/TypeSwitch-0.1.0-macOS-universal-preview.dmg --version 0.1.0 --build-number 1 --preview
