name: Feature request
description: Propose a focused improvement to TypeSwitch.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What typing or setup problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include a synthetic example and any relevant app or layout.
    validations:
      required: true
